packages:
  - 'apps/*'
  - 'packages/*'

# Hostinger's panel runs its own corepack/pnpm and must stay on the pnpm 10
# line: do NOT add v11+ keys such as `allowBuilds` here — they can signal
# a newer pnpm (11/12) to host heuristics and break installs with
# `bin/pnpm.cjs MODULE_NOT_FOUND` on corepack<=0.34. pnpm 10 uses the
# `onlyBuiltDependencies` list below so postinstall scripts (Prisma engines
# download, esbuild/unrs-resolver native binaries) still run and
# `prisma generate` / `next build` don't break.
onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - prisma
  - unrs-resolver

# v12 defaults publicHoistPattern to [] (v9 hoisted eslint/prettier to the
# workspace root). Workspace packages run `eslint` without declaring it, so
# restore that explicitly; scripts resolve it via the root node_modules/.bin.
publicHoistPattern:
  - '*eslint*'
  - '*prettier*'

overrides:
  '@types/react': 19.2.18
