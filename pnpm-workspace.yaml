packages:
  - 'apps/*'
  - 'packages/*'

# Static export build (no DB/server): no Prisma. Keep pnpm 10 line and do NOT
# add v11+ keys such as `allowBuilds` — they can signal a newer pnpm (11/12)
# to host heuristics and break installs with `bin/pnpm.cjs MODULE_NOT_FOUND`
# on corepack<=0.34. `onlyBuiltDependencies` below lets postinstall scripts
# (esbuild/unrs-resolver native binaries) run so `next build` doesn't break.
onlyBuiltDependencies:
  - esbuild
  - unrs-resolver

# v12 defaults publicHoistPattern to [] (v9 hoisted eslint/prettier to the
# workspace root). Workspace packages run `eslint` without declaring it, so
# restore that explicitly; scripts resolve it via the root node_modules/.bin.
publicHoistPattern:
  - '*eslint*'
  - '*prettier*'

overrides:
  '@types/react': 19.2.18
  # GHSA-pqg4-j6r4-53mv (critical): force patched shell-quote through the
  # mobile react-native > react-devtools-core chain until upstream bumps it.
  'shell-quote': 1.11.0
  # GHSA-5gmw-xhrv-c9v3 + GHSA-85c8-ppgw-ccpr (critical): tinypool <=2.1.0
  # is a prototype-pollution RCE gadget — polluted Object.prototype.
  # execArgv/env reach worker_threads.Worker, and Object.prototype.filename
  # redirects pool.run(task, options) to an attacker worker (vitest pool).
  # vitest 3.x pins ^1.1.1 and 1.x has no patched release — force 2.x
  # (2.1.2+ reads all options via withNullPrototype: own properties only).
  'tinypool': 2.2.0
