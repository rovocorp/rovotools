packages:
  - 'apps/*'
  - 'packages/*'

# Static export build (no DB/server): no Prisma. Keep pnpm 10 line and do NOT
# add v11+ keys such as `allowBuilds` — they can signal a newer pnpm (11/12)
# to host heuristics and break installs with `bin/pnpm.cjs MODULE_NOT_FOUND`
# on corepack<=0.34. `onlyBuiltDependencies` below lets postinstall scripts
# (esbuild/unrs-resolver native binaries) run so `next build` doesn't break.
onlyBuiltDependencies:
  - esbuild
  - unrs-resolver

# v12 defaults publicHoistPattern to [] (v9 hoisted eslint/prettier to the
# workspace root). Workspace packages run `eslint` without declaring it, so
# restore that explicitly; scripts resolve it via the root node_modules/.bin.
publicHoistPattern:
  - '*eslint*'
  - '*prettier*'

# Vitest resolves Vite as an auto-installed peer, so a pnpm override only
# rewrites the peer range and leaves the vulnerable version installed. The
# root package.json pins vite 7.3.7 directly (GHSA-587h-7wmj-h5pm /
# CVE-2026-112942); keep it while Vitest uses Vite as a peer.
overrides:
  '@types/react': 19.2.18
  # GHSA-pqg4-j6r4-53mv (critical): force patched shell-quote through the
  # mobile react-native > react-devtools-core chain until upstream bumps it.
  'shell-quote': 1.11.0
  # GHSA-5gmw-xhrv-c9v3 + GHSA-85c8-ppgw-ccpr (critical): tinypool <=2.1.0
  # is a prototype-pollution RCE gadget — polluted Object.prototype.
  # execArgv/env reach worker_threads.Worker, and Object.prototype.filename
  # redirects pool.run(task, options) to an attacker worker (vitest pool).
  # vitest 3.x pins ^1.1.1 and 1.x has no patched release — force 2.x
  # (2.1.2+ reads all options via withNullPrototype: own properties only).
  'tinypool': 2.2.0
  # GHSA-wq5f-xc86-pv6w / CVE-2026-96889 (high): sharp <0.35.5 ships a
  # librsvg with a memory bug allowing RCE on glibc Linux. next declares
  # ^0.35.4 — pin the patched 0.35.5 (librsvg 2.63.2). apps/web standalone
  # lockfile already resolves 0.35.5 for Hostinger.
  'sharp': '0.35.5'
  # GHSA-c475-qrg2-pj4r (high): basic-ftp <=6.2.0 Client.list() Unix parser
  # (parseListUnix RE_LINE) is quadratic — a malicious FTP server can freeze
  # the event loop via one crafted listing line. Only consumer is
  # @lhci/cli > proxy-agent > get-uri (dev chain, ftp:// PAC fetch); get-uri
  # pins ^5.0.2 with no patched 5.x — force 6.2.3 (same CJS API surface:
  # Client/access/lastMod/list/downloadTo/close).
  # GHSA-5pm8-86m8-9m6r / CVE-2026-126345: MLSD parser TypeError via a
  # __proto__ fact name DoS. 6.2.4 is patched; 6.2.6 is latest on the 6.x line.
  'basic-ftp': '6.2.6'
  # GHSA-27r3-jxmh-p828 / CVE-2026-111181: body-parser DoS via trailing bytes
  # after a compressed request body. Chain: @lhci/cli > express 4 (dev-only,
  # Lighthouse). 1.20.9 is the patched 1.x release express 4 depends on.
  'body-parser': '1.20.9'
  # GHSA-mrhx-c7xc-m3w5 / CVE-2023-54404: zod unbounded array/Set/Map
  # validation (resource exhaustion). No 3.x fix exists - the patch landed in
  # v4 only, so force 4.6.7. Direct deps (web + @rovotools/validation) move to
  # ^4.6.7; the remaining 3.x consumer is @expo/cli, whose surface here is just
  # z.object/string/enum/array/optional/.strict (all stable across the major).
  'zod': '4.6.7'
  # --- batch audit remediation (29 findings: 24 fixed, 5 accepted) -----------
  # GHSA-rxp7-6hxx-x8q5 (moderate): ip-address <=10.7.3 Address6 zone regex
  # is quadratic on many `%` characters before a line terminator. Dev-only
  # chain: @lhci/cli > proxy-agent > socks; 10.7.4 reads the input once.
  'ip-address': '10.7.4'
  # GHSA-5c6j-r48x-rmvq (high, RCE): serialize-javascript RegExp.flags/Date
  # prototype gadget. Chain: next-pwa>workbox>rollup-plugin-terser (pins ^4/^6);
  # 7.x keeps the CJS serialize() API.
  'serialize-javascript': '7.1.2'
  # GHSA-68fv-2mgg-jv7q (high): source-map-js indexed-section event-loop DoS.
  'source-map-js': '1.2.2'
  # GHSA-hrr3-gc8f-f4qj (moderate): fast-uri host case-normalization.
  'fast-uri': '3.1.8'
  # GHSA-ph9p-34f9-6g65 (high) + GHSA-52f5-9888-hmc6 (low): tmp path
  # traversal / symlink write via @lhci/cli and inquirer>external-editor.
  'tmp': '0.2.7'
  # GHSA-qhr7-859c-m2p7 + GHSA-6j4f-fj2g-mc7p + GHSA-q2hr-2g5m-vwhr:
  # brace-expansion recursion/quadratic DoS (mobile eslint>minimatch chain).
  'brace-expansion': '1.1.21'
  # GHSA-vcc3-ghjq-m6fr (moderate): decode-uri-component exponential decoding
  # (expo-router>query-string pins ^0.2). GHSA-qr28-fpjm-wq7f / CVE-2026-118664,
  # quadratic replacement of percent-encoded runs: 0.5.1 is the patched release.
  'decode-uri-component': '0.5.1'
  # GHSA-2m5v-pch6-74hx (CVE-2026-109383), GHSA-4w7w-5xrc-9h26 (CVE-2026-109829),
  # GHSA-55wc-3pg8-jfw6/GHSA-qrxm-fqhp-jwvm/GHSA-4qv8-2p9j-2685/GHSA-9fm3-97px-rjf6/
  # GHSA-f72v-6w45-q472/GHSA-xjj6-f33q-929c: TLS-validation bypass, cache poisoning
  # and assorted response-parsing DoS. Chain: dev-only jsdom > undici. Same-major
  # 8.13.1 is latest and clears every published undici advisory for the 8.x line.
  'undici': '8.13.1'
  # GHSA-w5hq-g745-h8pq (moderate): uuid v3/v5 buffer bounds. 11.1.1 is the
  # first patched and stays dual CJS/ESM (lighthouse + @expo/config-plugins>xcode).
  'uuid': '11.1.1'
  # GHSA-hp3w-g68c-fv3c (moderate, CVE-2026-97058): sprintf-js unbounded
  # precision DoS (argparse chains). No fix exists — the advisory was widened
  # to <=1.1.3 on 2026-10-05 and 1.1.3 is npm latest — so keep the pin and
  # the rationale in docs/SECURITY_EXCEPTIONS.md; format strings are
  # argparse's own fixed literals, never user input.
  'sprintf-js': '1.1.3'
  # GHSA-5p2g-fcmc-qvqq (CVE-2025-71329, JXL/HEIF) + GHSA-w3rx-r6r6-pgpr
  # (CVE-2025-71330, ICNS) (high): image-size <=2.0.2 loops forever on a
  # zero-size box/entry and hangs the Node event loop. Chain:
  # expo>expo-modules-core>react-native-worklets>@react-native/metro-config>
  # metro-config>metro>image-size (Metro asset dimensions, build time only).
  # The fixed 1.x never shipped (npm `legacy` tag is stuck on 1.2.1), so force
  # 2.0.4. Metro calls `_interopRequireDefault(require('image-size')).default`
  # with a Buffer and 2.x CJS sets `exports.default = imageSize`, and both
  # return {width, height, type} — call site unchanged; 2.x drops `queue`.
  'image-size': '2.0.4'
  # GHSA-rhr8-3pm8-cq29 / CVE-2026-119191: asn1.fromDer BIT STRING decoding
  # ignores maxDepth and recursively decodes nested BIT STRINGs, so crafted
  # DER/PEM aborts Node (incomplete fix of CVE-2025-66031). node-forge 1.4.0
  # also carries ~20 other 2026 forge advisories; 1.4.4 is latest and clears
  # all of them. Chain: mobile expo > expo-server / @expo/code-signing-certificates.
  'node-forge': '1.4.4'
  # GHSA-3g3m-2fjr-6pw4 / CVE-2026-118773: glob AbortSignal cancellation bypass.
  # GHSA-g3hv-75wg-m249 / CVE-2026-118764: minimatch globparts amplification DoS.
  # Both are reached only through the mobile @expo/* build tooling (glob 13 ->
  # minimatch 10). glob 14 pulls minimatch ^11, so this scoped bump clears both
  # without touching the legacy glob 7 / minimatch 3+5 consumers.
  'glob@^13.0.0': '14.0.6'
  # minimatch is also a direct dep of @expo/fingerprint and
  # @typescript-eslint/typescript-estree; scope the fix to the vulnerable 10.x
  # line so minimatch 3/5 (legacy glob/jest) stay untouched.
  'minimatch@^10.0.0': '11.0.9'
  # GHSA-6pq8-jhm2-2vcw / CVE-2026-110816: qs.stringify arrayFormat=comma
  # TypeError on non-coercible array elements. 6.17.1 is latest 6.x.
  'qs': '6.17.1'
  # GHSA-4r6h-8v6p-xvw6 (high, PP) + GHSA-5pgg-2g8v-p4x9 (high, ReDoS):
  # SheetJS never publishes fixes to npm — official patched builds ship only
  # on cdn.sheetjs.com. xlsx used client-side (PdfToExcel) via `import * as XLSX`.
  'xlsx': 'https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz'
