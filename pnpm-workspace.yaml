packages:
  - 'apps/*'
  - 'packages/*'

# Static export build (no DB/server): no Prisma. Keep pnpm 10 line and do NOT
# add v11+ keys such as `allowBuilds` — they can signal a newer pnpm (11/12)
# to host heuristics and break installs with `bin/pnpm.cjs MODULE_NOT_FOUND`
# on corepack<=0.34. `onlyBuiltDependencies` below lets postinstall scripts
# (esbuild/unrs-resolver native binaries) run so `next build` doesn't break.
onlyBuiltDependencies:
  - esbuild
  - unrs-resolver

# v12 defaults publicHoistPattern to [] (v9 hoisted eslint/prettier to the
# workspace root). Workspace packages run `eslint` without declaring it, so
# restore that explicitly; scripts resolve it via the root node_modules/.bin.
publicHoistPattern:
  - '*eslint*'
  - '*prettier*'

overrides:
  '@types/react': 19.2.18
  # GHSA-pqg4-j6r4-53mv (critical): force patched shell-quote through the
  # mobile react-native > react-devtools-core chain until upstream bumps it.
  'shell-quote': 1.11.0
  # GHSA-5gmw-xhrv-c9v3 + GHSA-85c8-ppgw-ccpr (critical): tinypool <=2.1.0
  # is a prototype-pollution RCE gadget — polluted Object.prototype.
  # execArgv/env reach worker_threads.Worker, and Object.prototype.filename
  # redirects pool.run(task, options) to an attacker worker (vitest pool).
  # vitest 3.x pins ^1.1.1 and 1.x has no patched release — force 2.x
  # (2.1.2+ reads all options via withNullPrototype: own properties only).
  'tinypool': 2.2.0
  # GHSA-wq5f-xc86-pv6w / CVE-2026-96889 (high): sharp <0.35.5 ships a
  # librsvg with a memory bug allowing RCE on glibc Linux. next declares
  # ^0.35.4 — pin the patched 0.35.5 (librsvg 2.63.2). apps/web standalone
  # lockfile already resolves 0.35.5 for Hostinger.
  'sharp': '0.35.5'
  # GHSA-c475-qrg2-pj4r (high): basic-ftp <=6.2.0 Client.list() Unix parser
  # (parseListUnix RE_LINE) is quadratic — a malicious FTP server can freeze
  # the event loop via one crafted listing line. Only consumer is
  # @lhci/cli > proxy-agent > get-uri (dev chain, ftp:// PAC fetch); get-uri
  # pins ^5.0.2 with no patched 5.x — force 6.2.3 (same CJS API surface:
  # Client/access/lastMod/list/downloadTo/close).
  'basic-ftp': '6.2.3'
  # --- batch audit remediation (29 findings) ---------------------------------
  # GHSA-5c6j-r48x-rmvq (high, RCE): serialize-javascript RegExp.flags/Date
  # prototype gadget. Chain: next-pwa>workbox>rollup-plugin-terser (pins ^4/^6);
  # 7.x keeps the CJS serialize() API.
  'serialize-javascript': '7.1.2'
  # GHSA-68fv-2mgg-jv7q (high): source-map-js indexed-section event-loop DoS.
  'source-map-js': '1.2.2'
  # GHSA-hrr3-gc8f-f4qj (moderate): fast-uri host case-normalization.
  'fast-uri': '3.1.8'
  # GHSA-ph9p-34f9-6g65 (high) + GHSA-52f5-9888-hmc6 (low): tmp path
  # traversal / symlink write via @lhci/cli and inquirer>external-editor.
  'tmp': '0.2.7'
  # GHSA-qhr7-859c-m2p7 + GHSA-6j4f-fj2g-mc7p + GHSA-q2hr-2g5m-vwhr:
  # brace-expansion recursion/quadratic DoS (mobile eslint>minimatch chain).
  'brace-expansion': '1.1.21'
  # GHSA-vcc3-ghjq-m6fr (moderate): decode-uri-component exponential decoding
  # (expo-router>query-string pins ^0.2).
  'decode-uri-component': '0.5.0'
  # GHSA-w5hq-g745-h8pq (moderate): uuid v3/v5 buffer bounds. 11.1.1 is the
  # first patched and stays dual CJS/ESM (lighthouse + @expo/config-plugins>xcode).
  'uuid': '11.1.1'
  # GHSA-hp3w-g68c-fv3c (moderate): sprintf-js unbounded precision DoS
  # (argparse chain); best-effort bump to latest 1.x.
  'sprintf-js': '1.1.3'
  # GHSA-4r6h-8v6p-xvw6 (high, PP) + GHSA-5pgg-2g8v-p4x9 (high, ReDoS):
  # SheetJS never publishes fixes to npm — official patched builds ship only
  # on cdn.sheetjs.com. xlsx used client-side (PdfToExcel) via `import * as XLSX`.
  'xlsx': 'https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz'
