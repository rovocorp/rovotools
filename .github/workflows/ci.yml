name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Required at build time; production deploys override per environment.
  NEXT_PUBLIC_SITE_URL: https://rovotools.com
  NEXT_PUBLIC_APP_NAME: RovoTools
  NEXT_PUBLIC_COMPANY_NAME: RovoCorp LTD
  # AdSense Auto ads (public publisher ID, also in public/ads.txt). Bakes the
  # SDK loader into the build; ads still require site approval + visitor
  # cookie consent at runtime (see AdSenseScript).
  NEXT_PUBLIC_ADSENSE_PUBLISHER_ID: ca-pub-8311202559739478

jobs:
  quality:
    name: Lint / Typecheck / Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # pnpm comes from npm (bundled with Node above), not pnpm/action-setup:
      # action-setup@v4 could not reliably place pnpm 10 on PATH (setup steps
      # failed with "Unable to locate executable file: pnpm" / exit 127),
      # while `npm install -g` is fully observable and debuggable. Keep the
      # version in sync with the root packageManager pin (10.22.0).
      - name: Install pnpm
        run: |
          npm install -g pnpm@10.22.0
          pnpm --version

      - run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        # Cross-package imports resolve to ./dist (see package.json main
        # entries), so packages must be built before lint/typecheck/tests.
        run: pnpm build:packages

      - name: Lint
        run: pnpm -r lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Unit tests
        run: pnpm -r test

      - name: Dependency audit (fail on critical)
        # Highs/moderates are triaged in docs/SECURITY_EXCEPTIONS.md.
        run: pnpm audit --prod --audit-level critical

  build:
    name: Production build (web)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # pnpm comes from npm (bundled with Node above), not pnpm/action-setup:
      # action-setup@v4 could not reliably place pnpm 10 on PATH (setup steps
      # failed with "Unable to locate executable file: pnpm" / exit 127),
      # while `npm install -g` is fully observable and debuggable. Keep the
      # version in sync with the root packageManager pin (10.22.0).
      - name: Install pnpm
        run: |
          npm install -g pnpm@10.22.0
          pnpm --version

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:web

      - name: Verify static export artifacts
        run: |
          test -f apps/web/public/sw.js || (echo "sw.js missing" && exit 1)
          test -f apps/web/out/index.html || (echo "out/index.html missing" && exit 1)
          test -f apps/web/out/sitemap.xml || (echo "out/sitemap.xml missing" && exit 1)

  e2e:
    name: E2E (Playwright, all engines)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # pnpm comes from npm (bundled with Node above), not pnpm/action-setup:
      # action-setup@v4 could not reliably place pnpm 10 on PATH (setup steps
      # failed with "Unable to locate executable file: pnpm" / exit 127),
      # while `npm install -g` is fully observable and debuggable. Keep the
      # version in sync with the root packageManager pin (10.22.0).
      - name: Install pnpm
        run: |
          npm install -g pnpm@10.22.0
          pnpm --version

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @rovotools/web exec playwright install --with-deps chromium firefox webkit

      - name: Build
        run: pnpm build:web

      - name: E2E tests
        run: pnpm --filter @rovotools/web e2e

  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # pnpm comes from npm (bundled with Node above), not pnpm/action-setup:
      # action-setup@v4 could not reliably place pnpm 10 on PATH (setup steps
      # failed with "Unable to locate executable file: pnpm" / exit 127),
      # while `npm install -g` is fully observable and debuggable. Keep the
      # version in sync with the root packageManager pin (10.22.0).
      - name: Install pnpm
        run: |
          npm install -g pnpm@10.22.0
          pnpm --version

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:web

      - name: Lighthouse CI
        working-directory: apps/web
        run: pnpm exec lhci autorun
